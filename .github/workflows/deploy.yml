name: Deploy Landing Page

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Esto evita el error de "Multiple artifacts" al cancelar ejecuciones previas
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Optimiza la velocidad de instalación

      - name: Instalar dependencias
        run: npm install

      - name: Construir proyecto (Build)
        run: npm run build

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite genera los archivos listos para la web en la carpeta 'dist'
          path: './dist'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
